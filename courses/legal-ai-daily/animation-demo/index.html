<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>40 Animation Examples</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #faf8f3;
      --ink: #15192a;
      --soft: #4a5066;
      --hair: #e2ddd0;
      --navy: #1c2742;
      --navy-2: #111b31;
      --gold: #b5872c;
      --gold-2: #c9a24b;
      --white: #ffffff;
      --right: #2e7d4f;
      --right-bg: #e6f3ea;
      --wrong: #c0392b;
      --wrong-bg: #fbeae8;
      --shadow: 0 18px 45px rgba(21, 25, 42, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, system-ui, sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(1600px, calc(100% - 40px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--hair);
      padding-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(2.8rem, 5vw, 5.6rem);
      font-weight: 600;
      line-height: 0.95;
      color: var(--navy);
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      min-height: 36px;
      border: 1px solid var(--hair);
      border-radius: 999px;
      background: var(--white);
      color: var(--ink);
      font: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      padding: 7px 13px;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease;
    }

    button:hover,
    button:focus-visible {
      border-color: var(--gold);
      transform: translateY(-1px);
      outline: none;
    }

    button.primary {
      background: var(--navy);
      color: var(--white);
      border-color: var(--navy);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }

    .tile {
      display: flex;
      min-height: 330px;
      flex-direction: column;
      gap: 13px;
      border: 1px solid var(--hair);
      border-radius: 6px;
      background: var(--white);
      padding: 16px;
      box-shadow: 0 1px 0 rgba(21, 25, 42, 0.03);
    }

    .tile-head {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: baseline;
    }

    .num {
      color: var(--gold);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    h2 {
      margin: 0;
      color: var(--navy);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.36rem;
      font-weight: 600;
      line-height: 1.05;
    }

    .note {
      min-height: 38px;
      color: var(--soft);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .stage {
      position: relative;
      display: grid;
      min-height: 152px;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--hair);
      border-radius: 6px;
      background: #fbfaf7;
      padding: 15px;
      isolation: isolate;
    }

    .stage.dark {
      background: var(--navy-2);
      border-color: rgba(181, 135, 44, 0.28);
      color: var(--white);
    }

    .motion-box,
    .motion-card,
    .motion-pill {
      display: grid;
      place-items: center;
      min-width: 92px;
      min-height: 58px;
      border: 1px solid var(--hair);
      border-radius: 5px;
      background: var(--white);
      color: var(--navy);
      padding: 12px;
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
    }

    .motion-card {
      width: 140px;
      min-height: 84px;
      box-shadow: var(--shadow);
    }

    .motion-pill {
      min-height: 34px;
      border-radius: 999px;
      padding: 6px 12px;
    }

    .bar,
    .track {
      position: relative;
      width: min(220px, 100%);
      height: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: #ebe5d8;
    }

    .fill {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--navy);
    }

    .mini-list {
      display: grid;
      width: 100%;
      gap: 8px;
    }

    .mini-list span,
    .step {
      display: block;
      border: 1px solid var(--hair);
      border-radius: 5px;
      background: var(--white);
      color: var(--navy);
      padding: 8px 10px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .steps {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dot {
      width: 18px;
      height: 18px;
      border: 1px solid var(--hair);
      border-radius: 50%;
      background: var(--white);
    }

    .line {
      width: 46px;
      height: 2px;
      background: var(--hair);
      transform-origin: left;
    }

    .screen {
      position: relative;
      width: min(250px, 100%);
      height: 104px;
      overflow: hidden;
      border: 1px solid var(--hair);
      border-radius: 5px;
      background: var(--white);
    }

    .screen-panel {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--navy);
      font-weight: 700;
    }

    .screen-panel.second {
      background: var(--navy);
      color: var(--white);
      transform: translateX(100%);
    }

    .tooltip {
      position: absolute;
      top: 24px;
      right: 22px;
      border: 1px solid var(--hair);
      border-radius: 5px;
      background: var(--white);
      color: var(--navy);
      padding: 8px 10px;
      font-size: 0.76rem;
      font-weight: 700;
      box-shadow: var(--shadow);
      transform-origin: bottom right;
      opacity: 0;
    }

    .modal {
      width: 170px;
      min-height: 90px;
      border: 1px solid var(--hair);
      border-radius: 6px;
      background: var(--white);
      color: var(--navy);
      box-shadow: 0 20px 60px rgba(21, 25, 42, 0.18);
      padding: 14px;
      text-align: center;
      font-weight: 700;
      opacity: 0;
      transform: scale(0.92);
    }

    .drawer {
      position: absolute;
      inset: 0 auto 0 0;
      width: 68%;
      display: grid;
      place-items: center;
      background: var(--navy);
      color: var(--white);
      font-weight: 700;
      transform: translateX(-100%);
    }

    .toast {
      position: absolute;
      right: 14px;
      bottom: 14px;
      border-radius: 5px;
      background: var(--navy);
      color: var(--white);
      padding: 10px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      opacity: 0;
      transform: translateY(12px);
    }

    .stamp {
      display: grid;
      width: 62px;
      height: 62px;
      place-items: center;
      border: 2px solid currentColor;
      border-radius: 50%;
      font-size: 1.45rem;
      font-weight: 800;
      transform: scale(0.4);
      opacity: 0;
    }

    .stamp.good {
      color: var(--right);
      background: var(--right-bg);
    }

    .stamp.bad {
      color: var(--wrong);
      background: var(--wrong-bg);
    }

    .heat {
      display: grid;
      width: min(230px, 100%);
      gap: 7px;
    }

    .heat span {
      height: 16px;
      border-radius: 999px;
      background: #ebe5d8;
      overflow: hidden;
    }

    .heat span::before {
      content: "";
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--gold);
    }

    .quote {
      max-width: 230px;
      color: var(--ink);
      font-size: 0.84rem;
      line-height: 1.6;
    }

    .quote mark {
      background: linear-gradient(90deg, rgba(181, 135, 44, 0.28), rgba(181, 135, 44, 0.28));
      background-size: 0 100%;
      background-repeat: no-repeat;
      color: inherit;
      padding: 0 2px;
    }

    .chart {
      display: flex;
      align-items: end;
      gap: 8px;
      height: 100px;
    }

    .chart span {
      width: 28px;
      height: 0;
      border-radius: 4px 4px 0 0;
      background: var(--navy);
    }

    .route {
      width: 230px;
      height: 104px;
    }

    .route path {
      fill: none;
      stroke: var(--gold);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 300;
      stroke-dashoffset: 300;
    }

    .athena {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(184, 154, 88, 0.26);
      border-radius: 12px 12px 4px 12px;
      background: linear-gradient(180deg, #16223c, #121d34);
      color: #eef1f8;
      padding: 14px;
      opacity: 0;
      transform: translateY(12px);
    }

    .portrait {
      width: 54px;
      height: 54px;
      border: 1px solid rgba(184, 154, 88, 0.35);
      border-radius: 50%;
      background: radial-gradient(circle at 50% 36%, #c9a24b 0 12%, #835c31 13% 34%, #101a30 35% 100%);
    }

    .athena strong {
      display: block;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1rem;
    }

    .athena span {
      color: #9aa3bb;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .burst {
      position: relative;
      width: 90px;
      height: 90px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--navy);
      color: var(--white);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 2rem;
      font-weight: 600;
    }

    .burst::before,
    .burst::after {
      content: "";
      position: absolute;
      inset: -8px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      opacity: 0;
      transform: scale(0.5);
    }

    .tile-footer {
      display: flex;
      margin-top: auto;
      justify-content: flex-end;
    }

    .run .a-fade { animation: fadeIn 0.38s ease-out both; }
    .run .a-rise { animation: riseIn 0.38s ease-out both; }
    .run .a-left { animation: slideLeft 0.38s ease-out both; }
    .run .a-right { animation: slideRight 0.38s ease-out both; }
    .run .a-scale { animation: scaleIn 0.34s ease-out both; }
    .run .a-flip { animation: flipY 0.52s ease-out both; }
    .run .a-expand { animation: expandPanel 0.42s ease-out both; transform-origin: top; }
    .run .a-swap .first { animation: swapOut 0.34s ease-out both; }
    .run .a-swap .second { animation: swapIn 0.34s ease-out 0.12s both; }
    .run .a-fill .fill { animation: fillBar 0.55s ease-out both; }
    .run .a-counter { animation: scaleIn 0.26s ease-out both; }
    .run .a-shake { animation: headShake 0.38s ease both; }
    .run .a-flash { animation: wrongFlash 0.46s ease both; }
    .run .a-underline::after { animation: drawLine 0.44s ease-out both; }
    .run .a-stagger span { animation: riseIn 0.32s ease-out both; }
    .run .a-stagger span:nth-child(2) { animation-delay: 0.07s; }
    .run .a-stagger span:nth-child(3) { animation-delay: 0.14s; }
    .run .a-step .dot:nth-child(1) { animation: stepOn 0.25s ease-out both; }
    .run .a-step .line:nth-child(2) { animation: scaleX 0.25s ease-out 0.12s both; }
    .run .a-step .dot:nth-child(3) { animation: stepOn 0.25s ease-out 0.25s both; }
    .run .a-step .line:nth-child(4) { animation: scaleX 0.25s ease-out 0.37s both; }
    .run .a-step .dot:nth-child(5) { animation: stepOn 0.25s ease-out 0.5s both; }
    .run .a-carousel .first { animation: carouselOut 0.42s ease both; }
    .run .a-carousel .second { animation: carouselIn 0.42s ease 0.08s both; }
    .run .a-wipe::after { animation: wipeAcross 0.72s ease-out both; }
    .run .a-timeline .fill { animation: fillBar 0.68s ease-out both; }
    .run .a-connect .line { animation: scaleX 0.35s ease-out both; }
    .run .a-spotlight::before { animation: spotlight 0.72s ease-out both; }
    .run .a-chip { animation: chipSnap 0.38s ease-out both; }
    .run .tooltip { animation: tooltipPop 0.36s ease-out both; }
    .run .modal { animation: modalIn 0.36s ease-out both; }
    .run .drawer { animation: drawerIn 0.36s ease-out both; }
    .run .toast { animation: toastIn 0.38s ease-out both; }
    .run .stamp { animation: stampIn 0.4s ease-out both; }
    .run .a-lift { animation: liftCard 0.38s ease both; }
    .run .a-border::before { animation: borderTrace 0.8s ease-out both; }
    .run .heat span:nth-child(1)::before { animation: heatFill 0.42s ease-out both; }
    .run .heat span:nth-child(2)::before { animation: heatFill 0.42s ease-out 0.1s both; }
    .run .heat span:nth-child(3)::before { animation: heatFill 0.42s ease-out 0.2s both; }
    .run .quote mark { animation: markSweep 0.55s ease-out both; }
    .run .a-drop { animation: confidenceDrop 0.56s ease-out both; }
    .run .a-compress { animation: compressWindow 0.58s ease-out both; }
    .run .a-split .second { animation: splitReveal 0.52s ease-out both; }
    .run .a-scrub .fill { animation: scrubFill 0.72s ease-out both; }
    .run .chart span:nth-child(1) { animation: chartGrow 0.46s ease-out both; }
    .run .chart span:nth-child(2) { animation: chartGrow 0.46s ease-out 0.08s both; }
    .run .chart span:nth-child(3) { animation: chartGrow 0.46s ease-out 0.16s both; }
    .run .route path { animation: routeDraw 0.88s ease-out both; }
    .run .athena { animation: athenaIn 0.4s ease-out both; }
    .run .a-crossfade .portrait { animation: crossPortrait 0.6s ease-in-out both; }
    .run .burst::before { animation: burstRing 0.52s ease-out both; }
    .run .burst::after { animation: burstRing 0.52s ease-out 0.12s both; }
    .run .a-pin { animation: pinDrop 0.42s ease-out both; }
    .run .a-reveal .second { animation: compareReveal 0.58s ease-out both; }
    .run .a-sort span:nth-child(1) { animation: sortLeft 0.42s ease-out both; }
    .run .a-sort span:nth-child(2) { animation: sortRight 0.42s ease-out both; }
    .run .a-fan span:nth-child(1) { animation: fanLeft 0.44s ease-out both; }
    .run .a-fan span:nth-child(2) { animation: fanCenter 0.44s ease-out both; }
    .run .a-fan span:nth-child(3) { animation: fanRight 0.44s ease-out both; }
    .run .a-lock { animation: lockState 0.48s ease-out both; }
    .run .a-scroll { animation: scrollReveal 0.52s ease-out both; }

    .a-underline {
      position: relative;
      padding-bottom: 7px;
    }

    .a-underline::after,
    .a-border::before,
    .a-wipe::after,
    .a-spotlight::before {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .a-underline::after {
      left: 14px;
      right: 14px;
      bottom: 9px;
      height: 2px;
      background: var(--gold);
      transform: scaleX(0);
      transform-origin: left;
    }

    .a-border {
      position: relative;
    }

    .a-border::before {
      inset: -4px;
      border: 2px solid var(--gold);
      border-radius: 8px;
      opacity: 0;
    }

    .a-wipe::after {
      inset: 0;
      background: linear-gradient(90deg, transparent 0 42%, rgba(181, 135, 44, 0.28) 50%, transparent 58% 100%);
      transform: translateX(-100%);
    }

    .a-spotlight::before {
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 0 30%, rgba(21, 25, 42, 0.18) 32% 100%);
      opacity: 0;
    }

    .a-fan {
      position: relative;
      width: 142px;
      height: 90px;
    }

    .a-fan span {
      position: absolute;
      inset: 10px 22px;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideLeft { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideRight { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.86); } to { opacity: 1; transform: scale(1); } }
    @keyframes flipY { from { opacity: 0; transform: rotateY(-84deg); } to { opacity: 1; transform: rotateY(0); } }
    @keyframes expandPanel { from { opacity: 0; transform: scaleY(0.25); } to { opacity: 1; transform: scaleY(1); } }
    @keyframes swapOut { to { opacity: 0; transform: translateY(-10px); } }
    @keyframes swapIn { to { transform: translateX(0); } }
    @keyframes fillBar { to { width: 82%; } }
    @keyframes headShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 50% { transform: translateX(7px); } 75% { transform: translateX(-4px); } }
    @keyframes wrongFlash { 0%, 100% { background: var(--white); border-color: var(--hair); } 45% { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); } }
    @keyframes drawLine { to { transform: scaleX(1); } }
    @keyframes stepOn { to { background: var(--navy); border-color: var(--navy); } }
    @keyframes scaleX { from { transform: scaleX(0); } to { transform: scaleX(1); background: var(--gold); } }
    @keyframes carouselOut { to { transform: translateX(-100%); opacity: 0; } }
    @keyframes carouselIn { to { transform: translateX(0); } }
    @keyframes wipeAcross { to { transform: translateX(100%); } }
    @keyframes spotlight { 20%, 80% { opacity: 1; } to { opacity: 0; } }
    @keyframes chipSnap { 0% { transform: translateY(18px) scale(0.88); opacity: 0; } 70% { transform: translateY(-3px) scale(1.04); opacity: 1; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes tooltipPop { to { opacity: 1; transform: translateY(-4px) scale(1); } }
    @keyframes modalIn { to { opacity: 1; transform: scale(1); } }
    @keyframes drawerIn { to { transform: translateX(0); } }
    @keyframes toastIn { to { opacity: 1; transform: translateY(0); } }
    @keyframes stampIn { 70% { opacity: 1; transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes liftCard { 50% { transform: translateY(-9px); border-color: var(--gold); box-shadow: var(--shadow); } }
    @keyframes borderTrace { 0% { opacity: 1; clip-path: inset(0 100% 92% 0); } 50% { clip-path: inset(0 0 92% 0); } 100% { opacity: 1; clip-path: inset(0); } }
    @keyframes heatFill { to { width: 100%; } }
    @keyframes markSweep { to { background-size: 100% 100%; } }
    @keyframes confidenceDrop { 0% { transform: translateY(-16px); opacity: 0; } 60% { transform: translateY(6px); opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes compressWindow { to { width: 58%; } }
    @keyframes splitReveal { to { clip-path: inset(0 0 0 50%); transform: translateX(0); } }
    @keyframes scrubFill { to { width: 66%; } }
    @keyframes chartGrow { to { height: var(--h); } }
    @keyframes routeDraw { to { stroke-dashoffset: 0; } }
    @keyframes athenaIn { to { opacity: 1; transform: translateY(0); } }
    @keyframes crossPortrait { 0%, 100% { filter: none; } 50% { filter: brightness(1.35) saturate(1.15); } }
    @keyframes burstRing { 0% { opacity: 0.8; transform: scale(0.58); } 100% { opacity: 0; transform: scale(1.35); } }
    @keyframes pinDrop { 0% { opacity: 0; transform: translateY(-24px) scale(0.9); } 65% { opacity: 1; transform: translateY(4px) scale(1.06); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes compareReveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0); transform: translateX(0); } }
    @keyframes sortLeft { to { transform: translate(-34px, 26px); background: var(--right-bg); color: var(--right); } }
    @keyframes sortRight { to { transform: translate(34px, 26px); background: var(--wrong-bg); color: var(--wrong); } }
    @keyframes fanLeft { to { transform: rotate(-14deg) translateX(-28px); } }
    @keyframes fanCenter { to { transform: translateY(-8px); } }
    @keyframes fanRight { to { transform: rotate(14deg) translateX(28px); } }
    @keyframes lockState { 50% { transform: scale(0.96); } 100% { background: var(--right-bg); border-color: var(--right); color: var(--right); } }
    @keyframes scrollReveal { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 1320px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    @media (max-width: 1040px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 760px) {
      main { width: min(100% - 24px, 560px); }
      header { align-items: start; flex-direction: column; }
      .actions { justify-content: flex-start; }
      .grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>40 Animation Examples</h1>
      <div class="actions">
        <button class="primary" id="replayAll">Replay all</button>
        <button id="resetAll">Reset</button>
      </div>
    </header>
    <div class="grid" id="grid"></div>
  </main>

  <script>
    const examples = [
      ["01", "Fade in", "Quiet section entrance.", "fade", "reveal"],
      ["02", "Rise in", "Scroll reveal for lesson sections.", "rise", "reveal"],
      ["03", "Slide from right", "Panel enters after a selection.", "left", "reveal"],
      ["04", "Slide from left", "Context panel returns to view.", "right", "reveal"],
      ["05", "Scale in", "Quiz feedback marker appears.", "scale", "reveal"],
      ["06", "Flip card", "Definition card turns over once.", "flip", "card"],
      ["07", "Accordion expand", "Hidden explanation opens.", "expand", "card"],
      ["08", "Panel swap", "Layer content cross-swaps.", "swap", "screen"],
      ["09", "Progress fill", "Completion indicator advances.", "fill", "bar"],
      ["10", "Counter count", "Stat block counts up.", "counter", "counter"],
      ["11", "Wrong shake", "Incorrect quiz option shakes once.", "shake", "card"],
      ["12", "Wrong flash", "Risk state flashes red.", "flash", "card"],
      ["13", "Underline draw", "Selected source gets a brass line.", "underline", "card"],
      ["14", "Stagger list", "Checklist items enter in order.", "stagger", "list"],
      ["15", "Stepper advance", "Workflow path advances.", "step", "step"],
      ["16", "Carousel slide", "Example panel slides to next.", "carousel", "screen"],
      ["17", "Compare wipe", "Before and after copy is revealed.", "wipe", "screen"],
      ["18", "Timeline sweep", "Lesson route fills left to right.", "timeline", "bar"],
      ["19", "Connector draw", "Stack nodes connect.", "connect", "step"],
      ["20", "Spotlight focus", "One sentence gets attention.", "spotlight", "card"],
      ["21", "Chip snap", "Sorted chip lands in place.", "chip", "chip"],
      ["22", "Tooltip pop", "Source note appears once.", "tooltip", "tooltip"],
      ["23", "Modal appear", "Decision result appears.", "modal", "modal"],
      ["24", "Drawer slide", "Source drawer opens.", "drawer", "drawer"],
      ["25", "Toast appear", "Save or completion notice.", "toast", "toast"],
      ["26", "Check stamp", "Correct answer mark.", "check", "stampGood"],
      ["27", "Cross stamp", "Unsupported claim mark.", "cross", "stampBad"],
      ["28", "Card lift", "Clickable card confirms hover grammar.", "lift", "card"],
      ["29", "Border trace", "Active panel border draws.", "border", "card"],
      ["30", "Risk heat fill", "Risk levels fill progressively.", "heat", "heat"],
      ["31", "Source highlight", "Evidence text gets marked.", "mark", "quote"],
      ["32", "Confidence drop", "Confidence label lands into warning.", "drop", "card"],
      ["33", "Context compress", "Context budget visibly shrinks.", "compress", "bar"],
      ["34", "Split toggle", "Firm and in-house views split.", "split", "screen"],
      ["35", "Scrub marker", "Slider path fills to a point.", "scrub", "bar"],
      ["36", "Chart grow", "Small bars grow on reveal.", "chart", "chart"],
      ["37", "Route path", "Decision path draws across nodes.", "route", "route"],
      ["38", "Athena entrance", "Briefing card appears on event.", "athena", "athena"],
      ["39", "Athena crossfade", "Portrait state shifts without looping.", "crossfade", "athena"],
      ["40", "Score burst", "Completion badge pulses once.", "burst", "burst"]
    ];

    const grid = document.getElementById("grid");

    function preview(kind, motion) {
      if (kind === "screen") {
        return `<div class="screen a-${motion}"><div class="screen-panel first">First</div><div class="screen-panel second">Second</div></div>`;
      }
      if (kind === "bar") {
        return `<div class="bar a-${motion}"><span class="fill"></span></div>`;
      }
      if (kind === "counter") {
        return `<div class="motion-card a-counter"><span class="counter-value">0</span></div>`;
      }
      if (kind === "list") {
        return `<div class="mini-list a-stagger"><span>Task</span><span>Facts</span><span>Review</span></div>`;
      }
      if (kind === "step") {
        return `<div class="steps a-${motion}"><span class="dot"></span><span class="line"></span><span class="dot"></span><span class="line"></span><span class="dot"></span></div>`;
      }
      if (kind === "chip") {
        return `<div class="motion-pill a-chip">Governance</div>`;
      }
      if (kind === "tooltip") {
        return `<div class="motion-card">Clause</div><div class="tooltip">Source required</div>`;
      }
      if (kind === "modal") {
        return `<div class="modal">Decision locked</div>`;
      }
      if (kind === "drawer") {
        return `<div class="drawer">Source drawer</div><div class="motion-card">Main view</div>`;
      }
      if (kind === "toast") {
        return `<div class="motion-card">Quiz answered</div><div class="toast">Saved</div>`;
      }
      if (kind === "stampGood") {
        return `<div class="stamp good">OK</div>`;
      }
      if (kind === "stampBad") {
        return `<div class="stamp bad">X</div>`;
      }
      if (kind === "heat") {
        return `<div class="heat"><span></span><span></span><span></span></div>`;
      }
      if (kind === "quote") {
        return `<p class="quote">The lawyer must <mark>verify every material claim</mark> before relying on the output.</p>`;
      }
      if (kind === "chart") {
        return `<div class="chart"><span style="--h: 42px"></span><span style="--h: 74px"></span><span style="--h: 96px"></span></div>`;
      }
      if (kind === "route") {
        return `<svg class="route" viewBox="0 0 230 104" aria-hidden="true"><path d="M20 78 C55 18, 92 18, 116 52 S170 90, 210 28"></path></svg>`;
      }
      if (kind === "athena") {
        return `<div class="athena a-${motion}"><div class="portrait"></div><div><strong>Athena</strong><span>${motion === "crossfade" ? "State change" : "Event nudge"}</span></div></div>`;
      }
      if (kind === "burst") {
        return `<div class="burst">40</div>`;
      }
      if (motion === "fan") {
        return `<div class="a-fan"><span class="motion-card">A</span><span class="motion-card">B</span><span class="motion-card">C</span></div>`;
      }
      if (motion === "sort") {
        return `<div class="a-sort"><span class="motion-pill">True</span><span class="motion-pill">Myth</span></div>`;
      }
      return `<div class="motion-card a-${motion}">${motion}</div>`;
    }

    function render() {
      grid.innerHTML = examples.map(([num, title, note, motion, kind]) => `
        <section class="tile" data-motion="${motion}">
          <div class="tile-head"><span class="num">${num}</span><h2>${title}</h2></div>
          <p class="note">${note}</p>
          <div class="stage ${kind === "athena" ? "dark" : ""}">${preview(kind, motion)}</div>
          <div class="tile-footer"><button data-run="${num}">Replay</button></div>
        </section>
      `).join("");
    }

    function runTile(tile) {
      const stage = tile.querySelector(".stage");
      stage.classList.remove("run");
      stage.offsetWidth;
      stage.classList.add("run");
      const counter = tile.querySelector(".counter-value");
      if (counter) animateCounter(counter, 87);
    }

    function animateCounter(node, target) {
      const start = performance.now();
      const duration = 700;
      function tick(now) {
        const progress = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        node.textContent = Math.round(target * eased);
        if (progress < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    render();

    grid.addEventListener("click", event => {
      const button = event.target.closest("button[data-run]");
      if (!button) return;
      runTile(button.closest(".tile"));
    });

    document.getElementById("replayAll").addEventListener("click", () => {
      document.querySelectorAll(".tile").forEach((tile, index) => {
        setTimeout(() => runTile(tile), index * 34);
      });
    });

    document.getElementById("resetAll").addEventListener("click", () => {
      document.querySelectorAll(".stage").forEach(stage => stage.classList.remove("run"));
      document.querySelectorAll(".counter-value").forEach(node => { node.textContent = "0"; });
    });

    document.getElementById("replayAll").click();
  </script>
  <script src="/js/bedazzler-analytics.js"></script>
</body>
</html>
